services:
  # IMPORTANT (SQLite): run with EXACTLY ONE uvicorn worker. start.sh
  # already launches uvicorn without --workers, which defaults to a single
  # worker. Multiple workers against SQLite cause write-lock contention. To
  # scale horizontally, migrate the database to PostgreSQL first. (Fix #13)
  elo:
    image: ghcr.io/reserve85/elo_ranking_system:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    ports:
      - "8000:8000"
    volumes:
      - elo_data:/data
      - elo_uploads:/uploads
      # config.yaml is OPTIONAL. When the host file is missing, the bind-mount
      # auto-creates an empty directory at /app/config.yaml; the app treats an
      # empty CONFIG_PATH directory as "no config file" and boots on .env/env
      # defaults instead of crash-looping (Fix M3). Copy config.yaml.example to
      # config.yaml only if you want YAML overrides:
      #   cp config.yaml.example config.yaml
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - UPLOAD_DIR=/uploads
      - DATABASE_URL=sqlite:////data/database.db

volumes:
  elo_data:
  elo_uploads:
