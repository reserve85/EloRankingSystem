{% extends "base.html" %}
{% block title %}Login - {{ app_name }}{% endblock %}
{% block extra_css %}
<style>
  /* Responsive logo scaling: adapt to viewport height so form is visible without scrolling */
  @media (max-height: 700px) {
    #login-logo {
      max-height: 25vh !important;
    }
  }
  @media (max-height: 580px) {
    #login-logo {
      max-height: 18vh !important;
    }
  }
</style>
{% endblock %}
{% block content %}
<div class="row d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="col-md-8 col-lg-6">
    <div class="text-center mb-4">
      <div class="d-flex justify-content-center login-logo-container">
        <img id="login-logo" src="" alt="" style="max-height:500px;max-width:500px;width:100%;height:auto;object-fit:contain;display:none;min-height:100px;" class="rounded mb-3">
      </div>
      {% if club_name %}
        <h1 class="h3 mb-1">{{ club_name }}</h1>
      {% endif %}
      <h2 class="h4 text-muted">{{ app_name }}</h2>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>
        <form id="login-form" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Your username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Your password" autocomplete="current-password" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
// Load club logo (theme-aware)
(function() {
  function loadLoginLogo() {
    try {
      var img = document.getElementById('login-logo');
      if (!img) return;
      var theme = document.documentElement.getAttribute('data-bs-theme') || 'light';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/settings/logo?mode=' + theme, true);
      xhr.responseType = 'blob';
      xhr.onload = function() {
        if (xhr.status === 200) {
          img.src = URL.createObjectURL(xhr.response);
          img.style.display = 'inline-block';
        }
      };
      xhr.send();
    } catch(e) {}
  }
  loadLoginLogo();
  // Re-load on theme change
  var toggleBtn = document.getElementById('theme-toggle-btn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      setTimeout(loadLoginLogo, 50);
    });
  }
})();

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const alertEl = document.getElementById('error-alert');
  alertEl.classList.add('d-none');
  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      body: formData,
      redirect: 'follow'
    });
    if (resp.ok) {
      window.location.href = '/ui/dashboard';
    } else {
      const data = await resp.json();
      alertEl.textContent = data.detail || 'Login failed';
      alertEl.classList.remove('d-none');
    }
  } catch (err) {
    alertEl.textContent = 'Connection error';
    alertEl.classList.remove('d-none');
  }
});
</script>
{% endblock %}
