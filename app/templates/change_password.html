{% extends "base.html" %}
{% block title %}Change Password - {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header d-print-none mb-4">
  <h2>Change Password</h2>
</div>
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body">
        <div id="pw-success" class="alert alert-success d-none"></div>
        <div id="pw-error" class="alert alert-danger d-none"></div>
        <div id="pw-errors" class="d-none"><ul class="mb-0 text-danger small"></ul></div>
        <form id="change-password-form">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" required minlength="8" oninput="checkPasswordStrength(this.value)">
            <div id="pw-strength" class="mt-1 small"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_new_password" class="form-control" required minlength="8">
          </div>
          <button type="submit" class="btn btn-warning w-100">Change Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function checkPasswordStrength(pw) {
  const el = document.getElementById('pw-strength');
  if (!pw) { el.innerHTML = ''; return; }
  const checks = [
    { ok: pw.length >= 8, msg: 'Min 8 characters' },
    { ok: /[A-Z]/.test(pw), msg: 'Uppercase letter' },
    { ok: /[a-z]/.test(pw), msg: 'Lowercase letter' },
    { ok: /[0-9]/.test(pw), msg: 'Number' },
    { ok: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(pw), msg: 'Special character' },
  ];
  const passed = checks.filter(c => c.ok).length;
  let html = '<div class="d-flex flex-wrap gap-1">';
  checks.forEach(c => {
    const icon = c.ok ? '✅' : '❌';
    const cls = c.ok ? 'text-green' : 'text-red';
    html += '<span class="' + cls + '">' + icon + ' ' + c.msg + '</span>';
  });
  html += '</div>';
  if (passed === checks.length) {
    html = '<div class="text-green fw-bold mb-1">✓ Password meets all requirements</div>' + html;
  }
  el.innerHTML = html;
}

document.getElementById('change-password-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const fd = new FormData(this);
  const sucEl = document.getElementById('pw-success');
  const errEl = document.getElementById('pw-error');
  const errsEl = document.getElementById('pw-errors');
  sucEl.classList.add('d-none'); errEl.classList.add('d-none'); errsEl.classList.add('d-none');
  const body = {
    current_password: fd.get('current_password'),
    new_password: fd.get('new_password'),
    confirm_new_password: fd.get('confirm_new_password')
  };
  const resp = await fetch('/password/change', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  const data = await resp.json();
  if (data.success) {
    sucEl.textContent = data.message; sucEl.classList.remove('d-none');
    this.reset();
  } else {
    errEl.textContent = data.message; errEl.classList.remove('d-none');
    if (data.errors && data.errors.length) {
      const ul = errsEl.querySelector('ul'); ul.innerHTML = '';
      data.errors.forEach(err => { ul.innerHTML += '<li>' + err + '</li>'; });
      errsEl.classList.remove('d-none');
    }
  }
});
</script>
{% endblock %}
